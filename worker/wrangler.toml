name = "spanish-conversation-companion"
main = "index.js"
compatibility_date = "2024-11-01"

# Restrict this to the exact URL your site is served from once you know it,
# e.g. "https://your-username.github.io". "*" works for local testing.
[vars]
ALLOWED_ORIGIN = "*"

# Bind a KV namespace for anonymous star-rating + comment feedback.
# Create it with:  wrangler kv namespace create FEEDBACK_KV
# then paste the returned id below.
[[kv_namespaces]]
binding = "FEEDBACK_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
